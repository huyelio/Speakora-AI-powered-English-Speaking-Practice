<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Speakora — Session Setup Concept 2</title>
  <style>
    :root{color-scheme:dark;--bg:#24202a;--panel:#2e2734;--tile:#38313d;--hover:#463a4e;--text:#f2e8f2;--body:#d4c5d5;--muted:#b7a8ba;--purple:#d3b4ee;--primary:#7c5d98;--border:#51455a}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,#24202a 60%,#2f2737);color:var(--body);font:16px/1.5 "Segoe UI",Arial,sans-serif}.frame{width:min(980px,100%);padding:clamp(24px,5vw,56px);border:1px solid var(--border);border-radius:30px;background:var(--panel)}
    .head{display:flex;align-items:end;justify-content:space-between;gap:24px;margin-bottom:30px}.brand{margin-bottom:28px;color:var(--purple);font-size:18px;font-weight:700}.mode{margin:0 0 8px;color:var(--purple);font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}.head h1{margin:0;color:var(--text);font-size:clamp(29px,4vw,42px);line-height:1.15;letter-spacing:-.035em}.head p{margin:10px 0 0;color:var(--muted)}.counter{white-space:nowrap;color:var(--muted);font-size:14px}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.topic{display:grid;grid-template-columns:60px 1fr auto;align-items:center;gap:13px;min-height:86px;padding:12px;border:1px solid transparent;border-radius:18px;background:var(--tile);transition:background .16s ease,border-color .16s ease}.topic:hover{background:var(--hover)}.topic.selected{border-color:var(--purple);background:#40364a}.art{position:relative;width:60px;height:60px;border-radius:15px;background:linear-gradient(145deg,var(--tone),#27222d)}.art:before,.art:after{content:"";position:absolute;inset:17px;border:2px solid rgb(255 255 255 / .62);border-radius:50%}.art:after{inset:25px 12px;border-width:2px 0 0;border-radius:0;transform:rotate(-35deg)}.topic:nth-child(2){--tone:#554039}.topic:nth-child(3){--tone:#563c46}.topic:nth-child(4){--tone:#35484a}.topic:nth-child(5){--tone:#3f435a}.topic:nth-child(6){--tone:#514931}.topic:first-child{--tone:#604879}.topic strong{color:var(--text);font-size:15px}.topic span{display:block;color:var(--muted);font-size:12px}.tick{width:24px;height:24px;display:grid;place-items:center;border-radius:50%;background:var(--purple);color:#2a2230;font-weight:800}.arrow{color:#84778a;font-size:20px}
    .footer{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-top:28px;padding-top:24px;border-top:1px solid var(--border)}.selection{color:var(--muted);font-size:14px}.selection strong{color:var(--text)}button{min-width:160px;min-height:50px;border:0;border-radius:15px;background:var(--primary);color:#fff;font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;transition:background .16s ease}button:hover{background:#695083}button:focus-visible{outline:3px solid var(--purple);outline-offset:3px}
    @media(max-width:760px){body{display:block;padding:0}.frame{min-height:100dvh;border:0;border-radius:0}.grid{grid-template-columns:repeat(2,1fr)}.head{align-items:start;flex-direction:column}.counter{display:none}}@media(max-width:520px){.grid{grid-template-columns:1fr}.footer{align-items:stretch;flex-direction:column}button{width:100%}}
  </style>
</head>
<body>
  <main class="frame">
    <div class="brand">Speakora</div>
    <header class="head"><div><p class="mode">Speaking by Topic</p><h1>Luyện nói theo chủ đề</h1><p>Chọn chủ đề bạn muốn luyện hôm nay</p></div><div class="counter">6 chủ đề</div></header>
    <section class="grid" aria-label="Danh sách chủ đề">
      <article class="topic selected"><div class="art" aria-label="Vùng minh họa Travel"></div><div><strong>Travel</strong><span>Đã chọn</span></div><b class="tick" aria-hidden="true">✓</b></article>
      <article class="topic"><div class="art" aria-label="Vùng minh họa Hobbies"></div><div><strong>Hobbies</strong><span>Sở thích</span></div><b class="arrow" aria-hidden="true">›</b></article>
      <article class="topic"><div class="art" aria-label="Vùng minh họa Food"></div><div><strong>Food</strong><span>Ẩm thực</span></div><b class="arrow" aria-hidden="true">›</b></article>
      <article class="topic"><div class="art" aria-label="Vùng minh họa Technology"></div><div><strong>Technology</strong><span>Công nghệ</span></div><b class="arrow" aria-hidden="true">›</b></article>
      <article class="topic"><div class="art" aria-label="Vùng minh họa Work"></div><div><strong>Work</strong><span>Công việc</span></div><b class="arrow" aria-hidden="true">›</b></article>
      <article class="topic"><div class="art" aria-label="Vùng minh họa Education"></div><div><strong>Education</strong><span>Giáo dục</span></div><b class="arrow" aria-hidden="true">›</b></article>
    </section>
    <footer class="footer"><div class="selection">Chủ đề đã chọn: <strong>Travel</strong></div><button type="button">Bắt đầu →</button></footer>
  </main>
</body>
</html>
