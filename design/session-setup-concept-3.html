<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Speakora — Session Setup Concept 3</title>
  <style>
    :root{color-scheme:dark;--bg:#24202a;--text:#f2e8f2;--body:#d4c5d5;--muted:#b7a8ba;--purple:#d3b4ee;--primary:#7c5d98;--line:#51455a;--soft:#383044}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 82% 16%,rgb(124 93 152 / .18),transparent 28%),var(--bg);color:var(--body);font:16px/1.55 "Segoe UI",Arial,sans-serif}.shell{width:min(1100px,calc(100% - 48px));margin:auto;padding:34px 0 56px}.top{display:flex;justify-content:space-between;align-items:center}.brand{color:var(--text);font-size:21px;font-weight:700;letter-spacing:-.03em}.quiet{color:var(--muted);font-size:13px}
    .layout{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(300px,.85fr);gap:clamp(48px,8vw,110px);align-items:center;min-height:calc(100vh - 130px)}.mode{color:var(--purple);font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}.copy h1{max-width:620px;margin:16px 0 12px;color:var(--text);font:600 clamp(42px,6vw,68px)/1.03 "Segoe UI",Arial,sans-serif;letter-spacing:-.055em}.copy>p{max-width:460px;margin:0 0 42px;color:var(--muted);font-size:18px}
    .preview{position:relative;height:270px;overflow:hidden;border-radius:30px;background:linear-gradient(145deg,#49345d,#2e2734)}.preview:before{content:"TRAVEL";position:absolute;right:-12px;bottom:-30px;color:rgb(255 255 255 / .06);font-size:100px;font-weight:800;letter-spacing:-.08em}.sun{position:absolute;width:74px;height:74px;right:42px;top:38px;border-radius:50%;background:#f0cdb5}.land{position:absolute;right:-5%;bottom:-18%;width:80%;height:65%;border-radius:50% 50% 0 0;background:#332b3a;transform:rotate(-9deg)}.route{position:absolute;left:42px;bottom:42px;width:100px;height:100px;border:3px dashed rgb(255 255 255 / .62);border-left-color:transparent;border-bottom-color:transparent;border-radius:50%;transform:rotate(-20deg)}
    .choices{border-top:1px solid var(--line)}.topic{display:grid;grid-template-columns:42px 1fr auto;align-items:center;gap:14px;min-height:70px;border-bottom:1px solid var(--line);transition:padding .16s ease,color .16s ease}.topic:hover{padding-left:8px;color:var(--text)}.mini-art{position:relative;width:38px;height:38px;border-radius:50%;background:var(--soft)}.mini-art:after{content:"";position:absolute;inset:12px;border:2px solid var(--muted);border-radius:5px;transform:rotate(18deg)}.topic strong{color:inherit;font-size:16px}.topic small{color:var(--muted)}.topic.selected{color:var(--text)}.selected .mini-art{background:var(--purple)}.selected .mini-art:after{border-color:#302737}.state{color:var(--purple);font-size:13px;font-weight:700}.dot{color:#776b7d}
    .action{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-top:30px}.action p{margin:0;color:var(--muted);font-size:13px}.action button{min-width:158px;min-height:52px;border:0;border-radius:15px;background:var(--primary);color:white;font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;transition:background .16s ease,transform .16s ease}.action button:hover{background:#695083;transform:translateY(-1px)}.action button:focus-visible{outline:3px solid var(--purple);outline-offset:4px}
    @media(max-width:800px){.layout{grid-template-columns:1fr;gap:42px;padding:60px 0}.copy h1{font-size:clamp(40px,10vw,60px)}.preview{height:220px}}@media(max-width:520px){.shell{width:calc(100% - 32px);padding-top:24px}.quiet{display:none}.layout{padding:48px 0}.copy>p{font-size:16px;margin-bottom:30px}.preview{height:190px}.action{align-items:stretch;flex-direction:column}.action button{width:100%}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="top"><div class="brand">Speakora</div><div class="quiet">Thiết lập buổi luyện tập</div></header>
    <section class="layout">
      <div class="copy"><div class="mode">Speaking by Topic</div><h1>Luyện nói theo chủ đề</h1><p>Chọn chủ đề bạn muốn luyện hôm nay</p><div class="preview" aria-label="Vùng minh họa Travel"><span class="sun"></span><span class="land"></span><span class="route"></span></div></div>
      <div>
        <div class="choices" aria-label="Danh sách chủ đề">
          <article class="topic selected"><span class="mini-art" aria-label="Vùng minh họa Travel"></span><strong>Travel</strong><span class="state">Đã chọn</span></article>
          <article class="topic"><span class="mini-art" aria-label="Vùng minh họa Hobbies"></span><strong>Hobbies</strong><span class="dot">·</span></article>
          <article class="topic"><span class="mini-art" aria-label="Vùng minh họa Food"></span><strong>Food</strong><span class="dot">·</span></article>
          <article class="topic"><span class="mini-art" aria-label="Vùng minh họa Technology"></span><strong>Technology</strong><span class="dot">·</span></article>
          <article class="topic"><span class="mini-art" aria-label="Vùng minh họa Work"></span><strong>Work</strong><span class="dot">·</span></article>
          <article class="topic"><span class="mini-art" aria-label="Vùng minh họa Education"></span><strong>Education</strong><span class="dot">·</span></article>
        </div>
        <div class="action"><p>Buổi luyện tập khoảng 10 phút</p><button type="button">Bắt đầu →</button></div>
      </div>
    </section>
  </main>
</body>
</html>
